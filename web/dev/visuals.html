<!doctype html>
<meta charset="utf-8">
<title>Versine — visual gallery</title>
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px; font-family: var(--body); }
  h1 { font-family: var(--display); color: var(--cool); font-size: 1.2rem; margin: 0 0 4px; }
  .note { color: var(--muted); font-size: .82rem; margin-bottom: 20px; max-width: 60ch; line-height: 1.5; }
  .row { display: grid; grid-template-columns: 130px 1fr 1fr; gap: 14px; align-items: start;
         padding: 14px 0; border-top: 1px solid var(--line); }
  .kind { font-family: var(--display); font-size: .82rem; color: var(--gold); padding-top: 8px; }
  .cell { min-height: 90px; }
  .cell h2 { font-family: var(--body); font-size: .68rem; text-transform: uppercase;
             letter-spacing: .06em; color: var(--dim); margin: 0 0 8px; }
  .box { background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .pr { margin-bottom: 8px; }
</style>
<h1>Visual gallery</h1>
<p class="note">
  Every visual kind, drawn from a real catalogue problem, in both states. Used
  as a visual baseline when renderers are refactored: capture this page before
  and after, and any difference is either intended or a regression.
</p>
<div id="out"></div>
<script type="module">
  import { renderVisual, VISUALS } from '../ui/visuals.js';
  import { renderPrompt, answerTerm } from '../ui/prompt.js';
  import { el } from '../ui/dom.js';

  const manifest = await (await fetch('../library/manifest.json')).json();
  const out = document.getElementById('out');
  const seen = new Set();

  for (const entry of manifest.levels) {
    if (seen.size === Object.keys(VISUALS).length) break;
    const lib = await (await fetch('../library/' + entry.file)).json();
    for (const p of lib.problems) {
      const kind = p.visual && p.visual.kind;
      if (!kind || seen.has(kind)) continue;
      seen.add(kind);

      const ask = el('div.box'), reveal = el('div.box');
      const askPrompt = el('div.problem.pr'), revPrompt = el('div.problem.pr');
      renderPrompt(askPrompt, p.prompt);
      renderPrompt(revPrompt, p.prompt, { blankAs: answerTerm(p.answer.type, p.answer.value) });
      const askVis = el('div.visual'), revVis = el('div.visual');
      ask.append(askPrompt, askVis);
      reveal.append(revPrompt, revVis);

      out.append(el('div.row', {},
        el('div.kind', {}, kind),
        el('div.cell', {}, el('h2', {}, 'asking'), ask),
        el('div.cell', {}, el('h2', {}, 'revealed'), reveal)));

      renderVisual(askVis, p.visual, { reveal: 1, animateFrom: 0 });
      renderVisual(revVis, p.visual, { showAnswer: true, animateFrom: null, verdict: 'ok' });
    }
  }
  document.title = `Versine — ${seen.size} visual kinds`;
</script>
